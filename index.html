<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Tracker BD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Laundry Tracker BD</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <button id="langBtn" type="button">বাংলা</button>
</header>
<main>
  <section aria-label="Dashboard">
    <h2 data-i18n="dashboard"></h2>
    <div class="stats">
      <div class="stat"><span class="num" id="statPending">0</span><span data-i18n="pending"></span></div>
      <div class="stat"><span class="num" id="statItems">0</span><span data-i18n="itemsInWash"></span></div>
      <div class="stat"><span class="num" id="statSpent">0.00</span><span data-i18n="spentMonth"></span></div>
      <div class="stat warn"><span class="num" id="statOverdue">0</span><span data-i18n="overdue"></span></div>
    </div>
  </section>

  <section aria-label="Add bundle">
    <h2 data-i18n="addBundle"></h2>
    <form id="bundleForm" novalidate>
      <label><span data-i18n="shop"></span><input id="shop" type="text" maxlength="80" required></label>
      <div class="row">
        <label><span data-i18n="givenDate"></span><input id="givenDate" type="date" required></label>
        <label><span data-i18n="pickupDate"></span><input id="pickupDate" type="date" required></label>
        <label><span data-i18n="cost"></span><input id="cost" type="number" min="0" step="0.01" placeholder="0.00" required></label>
      </div>
      <fieldset>
        <legend>Items</legend>
        <div class="item-grid" id="itemGrid"></div>
      </fieldset>
      <label><span data-i18n="note"></span><input id="note" type="text" maxlength="200"></label>
      <p class="msg" id="formMsg" role="alert"></p>
      <button type="submit" data-i18n="save"></button>
    </form>
  </section>

  <section aria-label="Bundles">
    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="search" aria-label="Search">
      <div class="filters" role="group">
        <button type="button" class="active" data-filter="all" data-i18n="all"></button>
        <button type="button" data-filter="pending" data-i18n="pendingF"></button>
        <button type="button" data-filter="ready" data-i18n="readyF"></button>
        <button type="button" data-filter="overdue" data-i18n="overdueF"></button>
        <button type="button" data-filter="collected" data-i18n="collectedF"></button>
      </div>
    </div>
    <div id="bundleList"></div>
  </section>

  <section aria-label="Data">
    <h2 data-i18n="data"></h2>
    <div class="data-row">
      <button type="button" id="exportBtn" data-i18n="exportBtn"></button>
      <label class="file-btn"><span data-i18n="importBtn"></span><input type="file" id="importFile" accept="application/json" hidden></label>
      <button type="button" class="danger" id="eraseBtn" data-i18n="eraseBtn"></button>
    </div>
  </section>
</main>
<footer><p data-i18n="footer"></p></footer>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
